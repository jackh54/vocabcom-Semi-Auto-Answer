# Builds the vocabbot desktop app: vocabbot.app for macOS (Apple Silicon and Intel), vocabbot.exe for Windows.
# - Push a tag like v2.0.0 (must match vocabbot.__version__) -> builds and publishes a GitHub Release.
# - Run manually (Actions tab -> Release -> Run workflow) -> builds only; download from the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: vocabbot-windows-x64
            bin: dist/vocabbot.exe
          - os: macos-latest          # Apple Silicon
            asset: vocabbot-macos-apple-silicon
            bin: dist/vocabbot.app/Contents/MacOS/vocabbot
          - os: macos-15-intel        # Intel Macs (macos-13 was retired Dec 2025)
            asset: vocabbot-macos-intel
            bin: dist/vocabbot.app/Contents/MacOS/vocabbot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest -c constraints.txt

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import vocabbot; print(vocabbot.__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match vocabbot.__version__ ($v)"; exit 1
          fi

      - name: Test
        run: pytest -q

      - name: Build
        run: pyinstaller packaging/vocabbot.spec --noconfirm

      - name: Self-test the packaged app
        shell: bash
        run: |
          # Loads every module the app needs without opening a window (the Windows build has no console).
          "./${{ matrix.bin }}" --self-test selftest.txt || true
          cat selftest.txt
          grep -q "^ok " selftest.txt

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.asset }}.zip" ./dist/vocabbot.exe
          else
            # ditto keeps the .app bundle intact (symlinks, permissions, signature)
            ditto -c -k --sequesterRsrc --keepParent dist/vocabbot.app "${{ matrix.asset }}.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "vocabbot $GITHUB_REF_NAME" \
            --generate-notes
